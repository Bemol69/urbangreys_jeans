# Configuración del panel /admin (Sveltia CMS)
# Cada cambio que se guarda aquí crea un commit en GitHub.
# Vercel arma la web (scripts/build.mjs) y la publica en ~30 segundos.

backend:
  name: github
  repo: Bemol69/urbangreys_jeans
  branch: main
  commit_messages:
    create: "Catálogo: crea {{collection}} «{{slug}}»"
    update: "Catálogo: actualiza {{collection}} «{{slug}}»"
    delete: "Catálogo: elimina {{collection}} «{{slug}}»"
    uploadMedia: "Catálogo: sube foto {{path}}"
    deleteMedia: "Catálogo: elimina foto {{path}}"

site_url: https://urbangreys-jeans.vercel.app/
display_url: https://urbangreys-jeans.vercel.app/
logo_url: ../img/logo.jpg

media_folder: img/productos
public_folder: /img/productos

# Nombres de archivo sin tildes ni ñ (ej: "Día del Niño" -> dia-del-nino.json)
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

# Las fotos del celular se achican y convierten a WebP al subirlas, para que la web cargue rápido
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1200
          height: 1200

collections:
  # ---------- CATEGORÍAS (filtros del catálogo) ----------
  - name: categorias
    label: Categorías
    label_singular: categoría
    description: "Los filtros del catálogo (Jeans pitillos, Jeans cargo, Accesorios…). Abre uno para elegir qué productos aparecen en él."
    icon: filter_list
    folder: data/categorias
    format: json
    create: true
    delete: true
    identifier_field: nombre
    slug: "{{nombre}}"
    summary: "{{nombre}}"
    sortable_fields:
      fields: [orden, nombre]
      default:
        field: orden
        direction: ascending
    fields:
      - name: nombre
        label: Nombre del filtro
        widget: string
        hint: "Así aparece en la web. Ej: Jeans flare"

      - name: productos
        label: Productos en este filtro
        widget: relation
        collection: productos
        value_field: "{{slug}}"
        search_fields: [nombre]
        display_fields: ["{{nombre}} · ${{precio}}"]
        multiple: true
        required: false
        hint: "Busca y marca los productos. Un mismo producto puede estar en varios filtros. Para moverlo, quítalo de aquí y agrégalo en el otro."

      - name: orden
        label: Posición
        widget: number
        value_type: int
        default: 100
        hint: "Los números más bajos aparecen primero en la barra de filtros."

      - name: visible
        label: Mostrar en la web
        widget: boolean
        default: true
        hint: "Desactívalo para esconder el filtro sin borrarlo (ej: sin stock por ahora)."

  # ---------- PRODUCTOS ----------
  - name: productos
    label: Productos
    label_singular: producto
    description: "Todos los jeans y accesorios. Para que un producto aparezca en un filtro, agrégalo desde Categorías."
    icon: checkroom
    folder: data/productos
    format: json
    create: true
    delete: true
    identifier_field: nombre
    slug: "{{nombre}}"
    summary: "{{nombre}} · ${{precio}}"
    thumbnail: foto
    sortable_fields:
      fields: [orden, nombre, precio]
      default:
        field: orden
        direction: ascending
    fields:
      - name: nombre
        label: Nombre del producto
        widget: string

      - name: precio
        label: Precio
        widget: number
        value_type: int
        min: 0
        hint: "Solo números, sin puntos ni signo $. Ej: 29990"

      - name: foto
        label: Foto principal
        widget: image
        hint: "Foto vertical. Recuerda tapar las caras antes de subirla."

      - name: fotos
        label: Más fotos
        label_singular: foto
        widget: list
        required: false
        field:
          name: foto
          label: Foto
          widget: image
        hint: "Opcional. La primera se muestra al pasar el mouse sobre el producto (ej: vista de espalda)."

      - name: descripcion
        label: Descripción
        widget: text
        required: false
        hint: "Opcional. Aparece bajo el nombre."

      - name: tallas
        label: Tallas disponibles
        label_singular: talla
        widget: list
        required: false
        field:
          name: talla
          label: Talla
          widget: string
        hint: "Una talla por línea. Ej: 36, 38, 40. Déjalo vacío en accesorios (talla única)."

      - name: etiqueta
        label: Etiqueta
        widget: string
        required: false
        hint: "Opcional. Aparece sobre la foto. Ej: Nuevo, Más vendido, Últimas unidades."

      - name: orden
        label: Posición
        widget: number
        value_type: int
        default: 1000
        hint: "Los números más bajos aparecen primero en el catálogo."

      - name: agotado
        label: Agotado
        widget: boolean
        default: false
        hint: "Si está activado, se muestra 'Consultar stock' en vez de 'Hacer pedido'."

      - name: visible
        label: Mostrar en la web
        widget: boolean
        default: true
        hint: "Desactívalo para ocultar el producto sin borrarlo."

  # ---------- OFERTAS ----------
  - name: ofertas
    label: Ofertas
    label_singular: oferta
    description: "Pon un descuento a muchos productos de una vez: elige una categoría completa o marca los productos en la lista (puedes marcar varios seguidos). En la web aparece el sello rojo «30% OFF» y el precio antiguo tachado. La oferta se activa y se apaga sola en sus fechas."
    icon: local_offer
    folder: data/ofertas
    format: json
    create: true
    delete: true
    identifier_field: titulo
    slug: "{{titulo}}"
    summary: "{{titulo}} · {{valor}} · {{activo}}"
    sortable_fields:
      fields: [titulo, hasta]
    fields:
      - name: titulo
        label: Nombre de la oferta
        widget: string
        hint: "Para que tú la reconozcas. Ej: Cyber Flare, Liquidación invierno."

      - name: tipo
        label: Tipo de descuento
        widget: select
        options:
          - { label: "Porcentaje (%)", value: porcentaje }
          - { label: "Precio fijo de oferta ($)", value: precio }
        default: porcentaje

      - name: valor
        label: Descuento
        widget: number
        value_type: int
        min: 1
        hint: "Solo el número. Porcentaje: 30 = 30% menos (el precio se redondea a la decena, ej: $24.990 → $17.490). Precio fijo: 19990 = todos los productos elegidos quedan a $19.990."

      - name: categorias
        label: Categorías completas
        widget: relation
        collection: categorias
        value_field: "{{slug}}"
        search_fields: [nombre]
        display_fields: [nombre]
        multiple: true
        required: false
        hint: "Lo más rápido: elige una categoría y la oferta aplica a todos sus productos (también a los que agregues después)."

      - name: productos
        label: Productos sueltos
        widget: relation
        collection: productos
        value_field: "{{slug}}"
        search_fields: [nombre]
        display_fields: ["{{nombre}} · ${{precio}}"]
        multiple: true
        required: false
        hint: "Abre la lista y marca todos los que quieras; se quedan marcados mientras sigues eligiendo. Se suman a las categorías de arriba."

      - name: etiqueta
        label: Texto del sello (opcional)
        widget: string
        required: false
        hint: "Vacío = muestra el descuento, ej: «30% OFF». Puedes poner algo corto, máx. 14 letras: CYBER, 2X1, LIQUIDACIÓN."

      - name: desde
        label: Empieza el
        widget: datetime
        format: "YYYY-MM-DD"
        time_format: false
        required: false
        hint: "Opcional. Vacío = empieza apenas guardes."

      - name: hasta
        label: Termina el
        widget: datetime
        format: "YYYY-MM-DD"
        time_format: false
        required: false
        hint: "Opcional. La oferta se quita sola al terminar ese día. Vacío = sigue hasta que la apagues."

      - name: activo
        label: Activa
        widget: boolean
        default: true
        hint: "Apágala para pausar la oferta sin borrarla."

  # ---------- AJUSTES ----------
  - name: ajustes
    label: Ajustes de la tienda
    icon: settings
    files:
      - name: ajustes
        label: WhatsApp, Instagram y envíos
        file: data/ajustes.json
        format: json
        fields:
          - name: whatsapp
            label: WhatsApp para pedidos
            widget: string
            pattern: ['^\+?[0-9 ]{10,17}$', "Formato internacional, ej: 56912345678"]
            hint: "Con código de país y sin +. Ej: 56985492735"
          - { name: instagram, label: Usuario de Instagram, widget: string, hint: "Sin @. Ej: urbangreys_jeans" }
          - name: empresas_envio
            label: Empresas de envío
            widget: select
            multiple: true
            options: [Starken, Chilexpress, Blue Express]
            default: [Starken, Chilexpress, Blue Express]
            hint: "Las que la clienta puede elegir al pedir un envío a otra ciudad."
          - name: tarjeta_envios
            label: Aceptar débito o crédito en envíos
            widget: boolean
            default: true
            hint: "Apágalo si en los envíos solo recibes transferencia (por ejemplo, si no tienes link de pago). En la tienda siempre se puede pagar con tarjeta."
          - name: precio_desde
            label: Precio «desde» de la portada
            widget: number
            value_type: int
            min: 0
            required: false
            hint: "El precio del parche dorado de la portada (Urban Greys · desde $...). Solo números, ej: 19990. Déjalo vacío para que se calcule solo con el jeans más barato del catálogo. Ojo: si pones un precio menor al de tus jeans, la clienta puede exigirlo."

  # ---------- FLYER, FRANJAS Y ENTREGAS ----------
  - name: inicio
    label: Flyer, franjas y entregas
    description: "El flyer de ofertas, las 2 franjas de texto en movimiento y las fotos o videos de «Entregas reales»."
    icon: campaign
    files:
      - name: flyer
        label: Flyer de ofertas
        file: data/flyer.json
        format: json
        fields:
          - name: mostrar
            label: Mostrar flyer en la web
            widget: boolean
            default: true
            required: false
            hint: "Apágalo cuando no haya oferta vigente: se ocultan la sección y la ventana emergente. No hace falta borrar lo demás, así lo reutilizas después."
          - name: popup
            label: Mostrar también como ventana emergente
            widget: boolean
            default: true
            required: false
            hint: "Aparece una vez por visita al entrar a la página."
          - name: imagen
            label: Imagen del flyer
            widget: image
            required: false
            media_folder: /img/flyer
            public_folder: /img/flyer
            hint: "Solo hay un flyer a la vez: para cambiarlo, sube la nueva imagen aquí. Ideal vertical 1080×1350 (formato post de Instagram). Sin imagen, el flyer no aparece en la web."
          - name: titulo
            label: Título de la sección
            widget: string
            required: false
            hint: "Aparece junto al flyer. Ej: Cyber, Día de la Madre. Vacío = «Ofertas»."
          - name: descripcion
            label: Texto de la oferta
            widget: text
            required: false
            hint: "Resume lo que dice el flyer (aparece junto a la imagen y ayuda a Google)."
          - name: mensaje_whatsapp
            label: Mensaje de WhatsApp
            widget: string
            required: false
            hint: "Lo que se escribe solo cuando tocan «Quiero esta oferta». Vacío = «Hola! Quiero la oferta 👖✨»."

      - name: franjas
        label: Franjas de texto
        file: data/franjas.json
        format: json
        fields:
          - name: franja1
            label: "Franja 1 (cinta oscura, arriba del todo)"
            widget: object
            fields:
              - name: frases
                label: Frases
                label_singular: frase
                widget: list
                min: 1
                field: { name: frase, label: Frase, widget: string }
                hint: "Una frase corta por línea. Puedes usar emojis. Ej: 📦 Envíos a todo Chile."
              - name: velocidad
                label: Velocidad
                widget: select
                options: [{ label: Lenta, value: lenta }, { label: Normal, value: normal }, { label: Rápida, value: rapida }]
                default: normal
          - name: franja2
            label: "Franja 2 (cinta turquesa, bajo la portada)"
            widget: object
            fields:
              - name: mostrar
                label: Mostrar en la web
                widget: boolean
                default: true
              - name: frases
                label: Frases
                label_singular: frase
                widget: list
                min: 1
                field: { name: frase, label: Frase, widget: string }
                hint: "Frases cortas y con fuerza (2 o 3 palabras). Ej: Tiro alto, Full push up, 2x1 en cinturones."
              - name: velocidad
                label: Velocidad
                widget: select
                options: [{ label: Lenta, value: lenta }, { label: Normal, value: normal }, { label: Rápida, value: rapida }]
                default: normal

      - name: entregas
        label: Entregas reales (hasta 3 fotos o videos)
        file: data/entregas.json
        format: json
        fields:
          - name: entregas
            label: Entregas
            label_singular: entrega
            widget: list
            required: false
            max: 3
            hint: "Hasta 3. Sin ninguna, la sección no aparece en la web. Puedes arrastrarlas para cambiar el orden."
            summary: "{{titulo}}"
            fields:
              - name: archivo
                label: Foto o video
                widget: file
                accept: "image/*,video/mp4,video/webm"
                media_folder: /img/entregas
                public_folder: /img/entregas
                hint: "Foto o video MP4 vertical, idealmente de menos de 15 segundos y 20 MB. Los videos se reproducen solos, sin sonido y en loop. Recuerda tapar las caras."
              - { name: titulo, label: Título, widget: string, required: false, hint: "Ej: Retiro en tienda" }
              - { name: texto, label: Bajada, widget: string, required: false, hint: "Ej: Pedido enviado a Talca por Starken" }
              - { name: descripcion, label: Descripción de la imagen, widget: string, required: false, hint: "Qué se ve en la foto o video (para Google y lectores de pantalla)." }
