# Configuración del panel /admin (Sveltia CMS)
# Cada cambio que se guarda aquí crea un commit en GitHub.
# Vercel arma la web (scripts/build.mjs) y la publica en ~30 segundos.

backend:
  name: github
  repo: Bemol69/urbangreys_jeans
  branch: main
  commit_messages:
    create: "Catálogo: crea {{collection}} «{{slug}}»"
    update: "Catálogo: actualiza {{collection}} «{{slug}}»"
    delete: "Catálogo: elimina {{collection}} «{{slug}}»"
    uploadMedia: "Catálogo: sube foto {{path}}"
    deleteMedia: "Catálogo: elimina foto {{path}}"

site_url: https://urbangreys-jeans.vercel.app/
display_url: https://urbangreys-jeans.vercel.app/
logo_url: ../img/logo.jpg

media_folder: img/productos
public_folder: /img/productos

# Nombres de archivo sin tildes ni ñ (ej: "Día del Niño" -> dia-del-nino.json)
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

# Las fotos del celular se achican y convierten a WebP al subirlas, para que la web cargue rápido
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1200
          height: 1200

collections:
  # ---------- CATEGORÍAS (filtros del catálogo) ----------
  - name: categorias
    label: Categorías
    label_singular: categoría
    description: "Los filtros del catálogo (Jeans pitillos, Jeans cargo, Accesorios…). Abre uno para elegir qué productos aparecen en él."
    icon: filter_list
    folder: data/categorias
    format: json
    create: true
    delete: true
    identifier_field: nombre
    slug: "{{nombre}}"
    summary: "{{nombre}}"
    sortable_fields:
      fields: [orden, nombre]
      default:
        field: orden
        direction: ascending
    fields:
      - name: nombre
        label: Nombre del filtro
        widget: string
        hint: "Así aparece en la web. Ej: Jeans flare"

      - name: productos
        label: Productos en este filtro
        widget: relation
        collection: productos
        value_field: "{{slug}}"
        search_fields: [nombre]
        display_fields: ["{{nombre}} · ${{precio}}"]
        multiple: true
        required: false
        hint: "Busca y marca los productos. Un mismo producto puede estar en varios filtros. Para moverlo, quítalo de aquí y agrégalo en el otro."

      - name: orden
        label: Posición
        widget: number
        value_type: int
        default: 100
        hint: "Los números más bajos aparecen primero en la barra de filtros."

      - name: visible
        label: Mostrar en la web
        widget: boolean
        default: true
        hint: "Desactívalo para esconder el filtro sin borrarlo (ej: sin stock por ahora)."

  # ---------- PRODUCTOS ----------
  - name: productos
    label: Productos
    label_singular: producto
    description: "Todos los jeans y accesorios. Para que un producto aparezca en un filtro, agrégalo desde Categorías."
    icon: checkroom
    folder: data/productos
    format: json
    create: true
    delete: true
    identifier_field: nombre
    slug: "{{nombre}}"
    summary: "{{nombre}} · ${{precio}}"
    thumbnail: foto
    sortable_fields:
      fields: [orden, nombre, precio]
      default:
        field: orden
        direction: ascending
    fields:
      - name: nombre
        label: Nombre del producto
        widget: string

      - name: precio
        label: Precio
        widget: number
        value_type: int
        min: 0
        hint: "Solo números, sin puntos ni signo $. Ej: 29990"

      - name: foto
        label: Foto principal
        widget: image
        hint: "Foto vertical. Recuerda tapar las caras antes de subirla."

      - name: fotos
        label: Más fotos
        label_singular: foto
        widget: list
        required: false
        field:
          name: foto
          label: Foto
          widget: image
        hint: "Opcional. La primera se muestra al pasar el mouse sobre el producto (ej: vista de espalda)."

      - name: descripcion
        label: Descripción
        widget: text
        required: false
        hint: "Opcional. Aparece bajo el nombre."

      - name: tallas
        label: Tallas disponibles
        label_singular: talla
        widget: list
        required: false
        field:
          name: talla
          label: Talla
          widget: string
        hint: "Una talla por línea. Ej: 36, 38, 40. Déjalo vacío en accesorios (talla única)."

      - name: etiqueta
        label: Etiqueta
        widget: string
        required: false
        hint: "Opcional. Aparece sobre la foto. Ej: Nuevo, Más vendido, Últimas unidades."

      - name: orden
        label: Posición
        widget: number
        value_type: int
        default: 1000
        hint: "Los números más bajos aparecen primero en el catálogo."

      - name: agotado
        label: Agotado
        widget: boolean
        default: false
        hint: "Si está activado, se muestra 'Consultar stock' en vez de 'Hacer pedido'."

      - name: visible
        label: Mostrar en la web
        widget: boolean
        default: true
        hint: "Desactívalo para ocultar el producto sin borrarlo."
