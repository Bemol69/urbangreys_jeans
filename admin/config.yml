# Configuración del panel /admin (Sveltia CMS)
# Cada cambio que se guarda aquí crea un commit en GitHub.
# Vercel arma la web (scripts/build.mjs) y la publica en ~30 segundos.

backend:
  name: github
  repo: Bemol69/urbangreys_jeans
  branch: main
  commit_messages:
    create: "Catálogo: crea {{collection}} «{{slug}}»"
    update: "Catálogo: actualiza {{collection}} «{{slug}}»"
    delete: "Catálogo: elimina {{collection}} «{{slug}}»"
    uploadMedia: "Catálogo: sube foto {{path}}"
    deleteMedia: "Catálogo: elimina foto {{path}}"

site_url: https://urbangreys-jeans.vercel.app/
display_url: https://urbangreys-jeans.vercel.app/
logo_url: ../img/logo.jpg

media_folder: img/productos
public_folder: /img/productos

# Nombres de archivo sin tildes ni ñ (ej: "Día del Niño" -> dia-del-nino.json)
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

# Las fotos del celular se achican y convierten a WebP al subirlas, para que la web cargue rápido
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1200
          height: 1200

collections:
  # ---------- CATEGORÍAS (filtros del catálogo) ----------
  - name: categorias
    label: Categorías
    label_singular: categoría
    description: "Los filtros del catálogo (Jeans pitillos, Jeans cargo, Accesorios…). Abre uno para elegir qué productos aparecen en él."
    icon: filter_list
    folder: data/categorias
    format: json
    create: true
    delete: true
    identifier_field: nombre
    slug: "{{nombre}}"
    summary: "{{nombre}}"
    sortable_fields:
      fields: [orden, nombre]
      default:
        field: orden
        direction: ascending
    fields:
      - name: nombre
        label: Nombre del filtro
        widget: string
        hint: "Así aparece en la web. Ej: Jeans flare"

      - name: productos
        label: Productos en este filtro
        widget: relation
        collection: productos
        value_field: "{{slug}}"
        search_fields: [nombre]
        display_fields: ["{{nombre}} · ${{precio}}"]
        multiple: true
        required: false
        hint: "Busca y marca los productos. Un mismo producto puede estar en varios filtros. Para moverlo, quítalo de aquí y agrégalo en el otro."

      - name: orden
        label: Posición
        widget: number
        value_type: int
        default: 100
        hint: "Los números más bajos aparecen primero en la barra de filtros."

      - name: visible
        label: Mostrar en la web
        widget: boolean
        default: true
        hint: "Desactívalo para esconder el filtro sin borrarlo (ej: sin stock por ahora)."

  # ---------- PRODUCTOS ----------
  - name: productos
    label: Productos
    label_singular: producto
    description: "Todos los jeans y accesorios. Para que un producto aparezca en un filtro, agrégalo desde Categorías."
    icon: checkroom
    folder: data/productos
    format: json
    create: true
    delete: true
    identifier_field: nombre
    slug: "{{nombre}}"
    summary: "{{nombre}} · ${{precio}}"
    thumbnail: foto
    sortable_fields:
      fields: [orden, nombre, precio]
      default:
        field: orden
        direction: ascending
    fields:
      - name: nombre
        label: Nombre del producto
        widget: string

      - name: precio
        label: Precio
        widget: number
        value_type: int
        min: 0
        hint: "Solo números, sin puntos ni signo $. Ej: 29990"

      - name: foto
        label: Foto principal
        widget: image
        hint: "Foto vertical. Recuerda tapar las caras antes de subirla."

      - name: fotos
        label: Más fotos
        label_singular: foto
        widget: list
        required: false
        field:
          name: foto
          label: Foto
          widget: image
        hint: "Opcional. La primera se muestra al pasar el mouse sobre el producto (ej: vista de espalda)."

      - name: descripcion
        label: Descripción
        widget: text
        required: false
        hint: "Opcional. Aparece bajo el nombre."

      - name: tallas
        label: Tallas disponibles
        label_singular: talla
        widget: list
        required: false
        field:
          name: talla
          label: Talla
          widget: string
        hint: "Una talla por línea. Ej: 36, 38, 40. Déjalo vacío en accesorios (talla única)."

      - name: etiqueta
        label: Etiqueta
        widget: string
        required: false
        hint: "Opcional. Aparece sobre la foto. Ej: Nuevo, Más vendido, Últimas unidades."

      - name: orden
        label: Posición
        widget: number
        value_type: int
        default: 1000
        hint: "Los números más bajos aparecen primero en el catálogo."

      - name: agotado
        label: Agotado
        widget: boolean
        default: false
        hint: "Si está activado, se muestra 'Consultar stock' en vez de 'Hacer pedido'."

      - name: visible
        label: Mostrar en la web
        widget: boolean
        default: true
        hint: "Desactívalo para ocultar el producto sin borrarlo."

  # ---------- CÓDIGOS DE DESCUENTO ----------
  - name: cupones
    label: Códigos de descuento
    label_singular: código de descuento
    description: "Códigos que tus clientas escriben en la bolsa. La web les dice si es válido y el descuento llega calculado en el mensaje de WhatsApp. Para un código de regalo de un solo uso, apágalo (o bórralo) cuando cierres la venta."
    icon: sell
    folder: data/cupones
    format: json
    create: true
    delete: true
    identifier_field: titulo
    slug: "{{titulo}}"
    summary: "{{codigo}} · {{titulo}} · {{activo}}"
    sortable_fields:
      fields: [titulo, codigo, vence]
    fields:
      - name: titulo
        label: Título
        widget: string
        hint: "Para que tú lo reconozcas y la clienta lo vea al aplicarlo. Ej: Bienvenida 10%, Regalo Camila."

      - name: codigo
        label: Código
        widget: string
        pattern: ['^[A-Za-z0-9-]{3,20}$', "Entre 3 y 20 letras, números o guiones, sin espacios ni tildes. Ej: URBAN10"]
        hint: "Lo que la clienta escribe. Da lo mismo si lo escribe con mayúsculas o minúsculas. Ideas: URBAN10, GIRLS15, REGALO-CAMI (para regalos, algo difícil de adivinar)."

      - name: tipo
        label: Tipo de descuento
        widget: select
        options:
          - { label: "Porcentaje (%)", value: porcentaje }
          - { label: "Monto fijo en pesos ($)", value: monto }
        default: porcentaje

      - name: valor
        label: Descuento
        widget: number
        value_type: int
        min: 1
        hint: "Solo el número. Si es porcentaje: 10 = 10% de descuento. Si es monto fijo: 5000 = $5.000 menos en el pedido."

      - name: categorias
        label: Aplica a estas categorías
        widget: relation
        collection: categorias
        value_field: "{{slug}}"
        search_fields: [nombre]
        display_fields: [nombre]
        multiple: true
        required: false
        hint: "Opcional. Ej: solo «Jeans cargo». Si dejas vacías las categorías Y los productos, el código sirve para toda la tienda."

      - name: productos
        label: Aplica a estos productos
        widget: relation
        collection: productos
        value_field: "{{slug}}"
        search_fields: [nombre]
        display_fields: ["{{nombre}} · ${{precio}}"]
        multiple: true
        required: false
        hint: "Opcional. Se suma a las categorías de arriba."

      - name: minimo
        label: Compra mínima
        widget: number
        value_type: int
        min: 0
        required: false
        hint: "Opcional. Monto mínimo (en productos donde aplica el código) para que funcione. Ej: 50000. Vacío = sin mínimo."

      - name: vence
        label: Válido hasta
        widget: datetime
        format: "YYYY-MM-DD"
        time_format: false
        required: false
        hint: "Opcional. El código deja de funcionar al terminar ese día. Vacío = sin fecha de término."

      - name: activo
        label: Activo
        widget: boolean
        default: true
        hint: "Apágalo cuando ya se usó (códigos de regalo) o para pausar una promo sin borrarla."

  # ---------- AJUSTES ----------
  - name: ajustes
    label: Ajustes de la tienda
    icon: settings
    files:
      - name: ajustes
        label: WhatsApp, Instagram y envíos
        file: data/ajustes.json
        format: json
        fields:
          - name: whatsapp
            label: WhatsApp para pedidos
            widget: string
            pattern: ['^\+?[0-9 ]{10,17}$', "Formato internacional, ej: 56912345678"]
            hint: "Con código de país y sin +. Ej: 56985492735"
          - { name: instagram, label: Usuario de Instagram, widget: string, hint: "Sin @. Ej: urbangreys_jeans" }
          - name: empresas_envio
            label: Empresas de envío
            widget: select
            multiple: true
            options: [Starken, Chilexpress, Blue Express]
            default: [Starken, Chilexpress, Blue Express]
            hint: "Las que la clienta puede elegir al pedir un envío a otra ciudad."
          - name: tarjeta_envios
            label: Aceptar débito o crédito en envíos
            widget: boolean
            default: true
            hint: "Apágalo si en los envíos solo recibes transferencia (por ejemplo, si no tienes link de pago). En la tienda siempre se puede pagar con tarjeta."

  # ---------- FLYER, FRANJAS Y ENTREGAS ----------
  - name: inicio
    label: Flyer, franjas y entregas
    description: "El flyer de ofertas, las 2 franjas de texto en movimiento y las fotos o videos de «Entregas reales»."
    icon: campaign
    files:
      - name: flyer
        label: Flyer de ofertas
        file: data/flyer.json
        format: json
        fields:
          - name: mostrar
            label: Mostrar flyer en la web
            widget: boolean
            default: true
            hint: "Apágalo cuando no haya oferta vigente. Se ocultan la sección y la ventana emergente."
          - name: popup
            label: Mostrar también como ventana emergente
            widget: boolean
            default: true
            hint: "Aparece una vez por visita al entrar a la página."
          - name: imagen
            label: Imagen del flyer
            widget: image
            required: false
            media_folder: /img/flyer
            public_folder: /img/flyer
            hint: "Solo hay un flyer a la vez: para cambiarlo, sube la nueva imagen aquí. Ideal vertical 1080×1350 (formato post de Instagram)."
          - name: titulo
            label: Título de la sección
            widget: string
            default: "Ofertas de la semana"
            hint: "Aparece junto al flyer. Ej: Cyber, Día de la Madre."
          - name: descripcion
            label: Texto de la oferta
            widget: text
            required: false
            hint: "Resume lo que dice el flyer (aparece junto a la imagen y ayuda a Google)."
          - name: mensaje_whatsapp
            label: Mensaje de WhatsApp
            widget: string
            hint: "Lo que se escribe solo cuando tocan «Quiero esta oferta»."

      - name: franjas
        label: Franjas de texto
        file: data/franjas.json
        format: json
        fields:
          - name: franja1
            label: "Franja 1 (cinta oscura, arriba del todo)"
            widget: object
            fields:
              - name: frases
                label: Frases
                label_singular: frase
                widget: list
                min: 1
                field: { name: frase, label: Frase, widget: string }
                hint: "Una frase corta por línea. Puedes usar emojis. Ej: 📦 Envíos a todo Chile."
              - name: velocidad
                label: Velocidad
                widget: select
                options: [{ label: Lenta, value: lenta }, { label: Normal, value: normal }, { label: Rápida, value: rapida }]
                default: normal
          - name: franja2
            label: "Franja 2 (cinta turquesa, bajo la portada)"
            widget: object
            fields:
              - name: mostrar
                label: Mostrar en la web
                widget: boolean
                default: true
              - name: frases
                label: Frases
                label_singular: frase
                widget: list
                min: 1
                field: { name: frase, label: Frase, widget: string }
                hint: "Frases cortas y con fuerza (2 o 3 palabras). Ej: Tiro alto, Full push up, 2x1 en cinturones."
              - name: velocidad
                label: Velocidad
                widget: select
                options: [{ label: Lenta, value: lenta }, { label: Normal, value: normal }, { label: Rápida, value: rapida }]
                default: normal

      - name: entregas
        label: Entregas reales (hasta 3 fotos o videos)
        file: data/entregas.json
        format: json
        fields:
          - name: entregas
            label: Entregas
            label_singular: entrega
            widget: list
            required: false
            max: 3
            hint: "Hasta 3. Sin ninguna, la sección no aparece en la web. Puedes arrastrarlas para cambiar el orden."
            summary: "{{titulo}}"
            fields:
              - name: archivo
                label: Foto o video
                widget: file
                accept: "image/*,video/mp4,video/webm"
                media_folder: /img/entregas
                public_folder: /img/entregas
                hint: "Foto o video MP4 vertical, idealmente de menos de 15 segundos y 20 MB. Los videos se reproducen solos, sin sonido y en loop. Recuerda tapar las caras."
              - { name: titulo, label: Título, widget: string, required: false, hint: "Ej: Retiro en tienda" }
              - { name: texto, label: Bajada, widget: string, required: false, hint: "Ej: Pedido enviado a Talca por Starken" }
              - { name: descripcion, label: Descripción de la imagen, widget: string, required: false, hint: "Qué se ve en la foto o video (para Google y lectores de pantalla)." }
